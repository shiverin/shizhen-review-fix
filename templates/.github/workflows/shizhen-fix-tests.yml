name: shizhen-fix guard tests

on:
  pull_request:
    paths:
      - .github/shizhen-fix/**
      - .github/workflows/shizhen-fix*.yml
      - .github/workflows/shizhen-review.yml
  push:
    paths:
      - .github/shizhen-fix/**
      - .github/workflows/shizhen-fix*.yml
      - .github/workflows/shizhen-review.yml

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test author restrictions and publication guards
        run: python3 -m unittest discover -s .github/shizhen-fix -p 'test_*.py' -v
